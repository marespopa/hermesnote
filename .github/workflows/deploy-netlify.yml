name: Deploy to Netlify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: next-client/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: next-client
        run: corepack yarn install --immutable

      - name: Type-check
        working-directory: next-client
        run: corepack yarn tsc --noEmit

      - name: Run unit tests
        working-directory: next-client
        run: corepack yarn test --run

      - name: Read release version
        id: version
        working-directory: next-client
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  release-wait:
    name: Release wait (v${{ needs.validate.outputs.version }})
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Await production approval
        run: echo "CI passed for v${{ needs.validate.outputs.version }}."

  deploy:
    name: Release v${{ needs.validate.outputs.version }}
    needs: [validate, release-wait]
    runs-on: ubuntu-latest
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy production site
        run: npx --yes netlify-cli@latest deploy --prod --build
