name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: next-client/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: next-client
        run: corepack yarn install --immutable

      - name: Type-check
        working-directory: next-client
        run: corepack yarn tsc --noEmit

      - name: Lint
        working-directory: next-client
        run: corepack yarn lint

      - name: Run unit tests
        working-directory: next-client
        run: corepack yarn test --run

      - name: Build production application
        working-directory: next-client
        run: corepack yarn build

  preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI_VERSION: 27.5.2

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy Netlify preview
        id: deploy
        run: npx --yes netlify-cli@$NETLIFY_CLI_VERSION deploy --build --json > deploy.json

      - name: Smoke-test preview
        run: |
          url="$(node -p "require('./deploy.json').deploy_url")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$url"

      - name: Publish preview summary
        run: |
          url="$(node -p "require('./deploy.json').deploy_url")"
          {
            echo "## Netlify preview"
            echo
            echo "[$url]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
